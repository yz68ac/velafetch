[project]
name = "velafetch"
dynamic = ["version"]
description = "A practical Bilibili CLI that grows from learning into real use."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bilibili", "downloader", "cli", "dash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "curl-cffi>=0.15,<1",
    "pydantic>=2.11,<3",
    "qrcode>=8.2,<9",
    "rich>=14,<15",
    "typer>=0.16,<1",
]

[project.scripts]
velafetch = "velafetch.cli.app:run"

[project.urls]
Homepage = "https://github.com/yz68ac/velafetch"
Repository = "https://github.com/yz68ac/velafetch.git"
Issues = "https://github.com/yz68ac/velafetch/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller==6.21.0",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/velafetch"]

[tool.hatch.version]
path = "src/velafetch/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
